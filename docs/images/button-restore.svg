<svg xmlns="http://www.w3.org/2000/svg" width="980" height="375" viewBox="0 0 980 375" role="img" aria-label="Restore the right state, not an outdated one">
<rect width="980" height="375" rx="22" fill="#0c2029"/>
<g font-family="Arial, sans-serif"><text x="36" y="53" fill="#f3fbfd" font-size="29" font-weight="700">Restore the right state, not an outdated one</text><text x="36" y="86" fill="#98b5c2" font-size="17">Example: the lamp starts ON. A later schedule says it must stay OFF.</text><rect x="36" y="128" width="278" height="170" rx="18" fill="#17333d" stroke="#3b6471"/><circle cx="64" cy="158" r="14" fill="#94e1c8"/><text x="64" y="163" text-anchor="middle" fill="#10232b" font-size="15" font-weight="700">1</text><text x="87" y="164" fill="#f3fbfd" font-size="19" font-weight="700">Single press</text><text x="58" y="201" fill="#c0d4dc" font-size="15">Remember: lamp ON</text><text x="58" y="228" fill="#c0d4dc" font-size="15">Run the button sequence</text><text x="58" y="255" fill="#c0d4dc" font-size="15">Lamp switches OFF</text><path d="M321 210 h18 m-6 -6 6 6 -6 6" fill="none" stroke="#94e1c8" stroke-width="3"/><rect x="346" y="128" width="278" height="170" rx="18" fill="#17333d" stroke="#3b6471"/><circle cx="374" cy="158" r="14" fill="#94e1c8"/><text x="374" y="163" text-anchor="middle" fill="#10232b" font-size="15" font-weight="700">2</text><text x="397" y="164" fill="#f3fbfd" font-size="19" font-weight="700">Schedule runs</text><text x="368" y="201" fill="#c0d4dc" font-size="15">A newer HA command</text><text x="368" y="228" fill="#c0d4dc" font-size="15">says lamp OFF again</text><text x="368" y="255" fill="#c0d4dc" font-size="15">That newer intent wins</text><path d="M631 210 h18 m-6 -6 6 6 -6 6" fill="none" stroke="#94e1c8" stroke-width="3"/><rect x="656" y="128" width="278" height="170" rx="18" fill="#17333d" stroke="#3b6471"/><circle cx="684" cy="158" r="14" fill="#94e1c8"/><text x="684" y="163" text-anchor="middle" fill="#10232b" font-size="15" font-weight="700">3</text><text x="707" y="164" fill="#f3fbfd" font-size="19" font-weight="700">Double press</text><text x="678" y="201" fill="#c0d4dc" font-size="15">Restore eligible devices</text><text x="678" y="228" fill="#c0d4dc" font-size="15">Skip this lamp</text><text x="678" y="255" fill="#c0d4dc" font-size="15">Lamp stays OFF</text><text x="36" y="340" fill="#94e1c8" font-size="15">Direct vendor-app or hardware changes without a HA service event cannot be tracked.</text></g></svg>
